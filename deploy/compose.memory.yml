services:
  ruvector-bridge:
    profiles: ["post-gate-a"]
    image: "${RUVECTOR_IMAGE_DIGEST:?set a source-lock-matched image@sha256 digest}"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    restart: "no"

  graphiti:
    profiles: ["post-gate-b"]
    image: "${GRAPHITI_IMAGE_DIGEST:?set a source-lock-matched image@sha256 digest}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:?required}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?required}"
    restart: "no"

  neo4j:
    profiles: ["post-gate-b"]
    image: "${NEO4J_IMAGE_DIGEST:?set neo4j:5.26.2@sha256 digest}"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:?required}/${NEO4J_PASSWORD:?required}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 20
    restart: "no"
