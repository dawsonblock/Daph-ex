name: ExFusion validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exfusion-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run complete test suite
        run: python -m pytest -q

  architecture-gates:
    name: Exact parity and physical compute gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run exact E2 and compute-ordering regression gates
        run: >-
          python -m pytest -q
          tests/test_qwen_exfusion_gate0b.py
          tests/test_effort_compute_ordering.py

      - name: Run HRM control-plane contract gates
        run: >-
          python -m pytest -q
          tests/test_hrm_control_plane.py
          tests/test_hrm_memory.py

      - name: Run synthetic Phase 0 pipeline
        run: >-
          python scripts/run_phase0_retention.py
          --synthetic
          --shallow-continuation
          --output runs/phase0-ci

      - name: Validate Gate 0B report contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("runs/phase0-ci/phase0b_gate_report.json")
          report = json.loads(report_path.read_text())
          parity = report["parity_metrics"]

          assert report["result"] == "PASS_EXACT", report
          assert parity["source_backbone_parameter_identity"] is True, parity
          assert parity["passed"] is True, parity
          assert parity["logit_mae"] == 0.0, parity
          assert parity["logit_max_abs"] == 0.0, parity
          assert parity["top1_agreement"] == 1.0, parity
          assert Path("runs/phase0-ci/qwen_exfusion_gate0b.pt").is_file()
          print("Gate 0B artifact contract: PASS_EXACT")
          PY

      - name: Upload Phase 0 evidence
        uses: actions/upload-artifact@v5
        with:
          name: phase0-synthetic-evidence
          path: |
            runs/phase0-ci/phase0b_gate_report.json
            runs/phase0-ci/phase0_metrics.json
            runs/phase0-ci/phase0_decision.md
            runs/phase0-ci/phase0_config.json
            runs/phase0-ci/phase0_dataset_manifest.json
            runs/phase0-ci/qwen_exfusion_gate0b.pt
          if-no-files-found: error
          retention-days: 14

  package:
    name: Build distributable package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: architecture-gates

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install build

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify package contents
        run: |
          python -m zipfile --list dist/*.whl
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: daph-exfusion-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
