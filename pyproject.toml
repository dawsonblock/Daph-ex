[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daph-exfusion"
version = "3.5.0"
description = "DAPH ExFusion, value-of-computation, and HRM external-memory research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DAPH / ExFusion contributors" }]
keywords = ["mamba", "ssm", "moe", "hybrid", "transformer", "model-merging", "dare", "ties"]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
pretrained = ["transformers>=4.40"]
hrm = ["transformers>=5.9.0", "huggingface-hub>=0.34"]

[tool.setuptools.packages.find]
where = ["."]
include = ["daph*", "hrm_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
