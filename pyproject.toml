[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daph-exfusion"
version = "3.4.0"
description = "DAPH ExFusion and standalone value-of-computation controller research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DAPH / ExFusion contributors" }]
keywords = ["mamba", "ssm", "moe", "hybrid", "transformer", "model-merging", "dare", "ties"]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
pretrained = ["transformers>=4.40"]

[tool.setuptools.packages.find]
where = ["."]
include = ["daph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
